name: HackerSM64 Pull Request CI

on:
  push:
    branches: [ master, main, hackerCI ]

jobs:
  build_default:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout reposistory
      uses: actions/checkout@v2
      with:
        submodules: recursive
    - name: Install Dependencies
      run:
        - sudo apt update
        - sudo apt install -y binutils-mips-linux-gnu gcc git gcc-mips-linux-gnu
        - sudo apt install -y python3 python-is-python3
    - name: Install python deps
      run: pip3 install pillow
    - name: Build HackerSM64 from scratch
      run: make -j$(nproc) VERBOSE=0 CI=1
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout reposistory
      uses: actions/checkout@v2
      with:
        submodules: recursive
    - name: Install Dependencies
      run: sudo apt update && sudo apt install -y binutils-mips-linux-gnu gcc git gcc-mips-linux-gnu
    - name: Build HackerSM64 from scratch
      run: make -j$(nproc) VERBOSE=0
